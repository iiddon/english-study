<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English Path — Belajar Bahasa Inggris Gratis</title>
<meta name="description" content="Belajar bahasa Inggris gratis dari A1 sampai C2: 36 pelajaran, 750 soal, bacaan, latihan dengar dan berbicara, dijelaskan dalam bahasa Indonesia.">
<meta name="theme-color" content="#c9f2e3">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="English Path">
<meta property="og:title" content="English Path — Belajar Bahasa Inggris Gratis">
<meta property="og:description" content="Dari A1 sampai C2. 750 soal, bacaan, latihan berbicara, misi harian. Gratis, tanpa daftar.">
<meta property="og:image" content="https://iiddon.github.io/english-study/icons/og.png">
<meta property="og:url" content="https://iiddon.github.io/english-study/">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=DM+Sans:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout idea: "Pop Berani" — sticker-book UI. Flat bold fills, 2.5px ink outlines,
     hard offset shadows that press down when tapped. One theme on purpose. */
  --bg:#c9f2e3; --surface:#ffffff; --ink:#111111; --muted:#3f4744; --rule:#111111; --soft:#eef7f3;
  --cobalt:#3d5afe; --yellow:#ffd84d; --pink:#ff8fc7; --mint:#7ee2b8; --red:#ff5c7a; --lilac:#c4a5ff;
  --good:#7ee2b8; --bad:#ff5c7a;
  --l1:#7ee2b8; --l2:#8fb3ff; --l3:#c4a5ff; --l4:#ffb86b; --l5:#ff8fc7; --l6:#ffd84d;
  --b:2.5px solid var(--ink); --sh:4px 4px 0 var(--ink); --sh-lg:6px 6px 0 var(--ink);
  --display:"Bricolage Grotesque","Arial Black",system-ui,sans-serif;
  --body:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:500 16px/1.5 var(--body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
button:disabled{cursor:default}
a{color:var(--cobalt)}
:focus-visible{outline:3px solid var(--cobalt);outline-offset:3px;border-radius:10px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- press-able sticker ---------- */
.pop{border:var(--b);box-shadow:var(--sh);transition:transform .08s,box-shadow .08s}
.pop:active:not(:disabled){transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}

/* ---------- shell ---------- */
.shell{max-width:1040px;margin:0 auto;padding:16px 16px 110px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;white-space:nowrap;font:800 22px/1 var(--display);letter-spacing:-.01em}
.brand .wm{overflow:hidden;text-overflow:ellipsis}
.mark{display:grid;place-items:center;width:40px;height:40px;border:var(--b);border-radius:11px;background:var(--yellow);box-shadow:3px 3px 0 var(--ink);font:800 17px/1 var(--display)}
.chips{display:flex;gap:8px;flex:none}
.chip{display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border:var(--b);border-radius:99px;background:var(--surface);box-shadow:3px 3px 0 var(--ink);font:800 16px/1 var(--display);font-variant-numeric:tabular-nums}
.chip .ic{fill:#ff6b2c;stroke:var(--ink);stroke-width:1.8}
.chip.xp{background:var(--yellow)}
.chip.xp .ic{fill:#fff;stroke:var(--ink)}
.nav{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:5;display:flex;gap:4px;padding:6px;border-radius:99px;background:var(--ink);box-shadow:0 6px 18px rgba(0,0,0,.22)}
.nav button{display:flex;align-items:center;gap:7px;height:46px;padding:0 16px;border-radius:99px;color:#fff;font:700 15px/1 var(--body);white-space:nowrap}
.nav button .ic{width:22px;height:22px}
.nav button[aria-current="page"]{background:var(--yellow);color:var(--ink)}
@media (max-width:420px){.nav button:not([aria-current="page"]) .t{display:none}.nav button{padding:0 14px}.brand{font-size:19px}.chip{padding:6px 9px;font-size:15px}}
body.focus .top,body.focus .nav{display:none}
body.focus .shell{padding-bottom:32px}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;display:none;z-index:9}

/* ---------- type ---------- */
h1{font:800 34px/1.02 var(--display);letter-spacing:-.025em;text-wrap:balance}
h2{font:800 22px/1.1 var(--display);letter-spacing:-.01em;text-wrap:balance}
h3{font:700 16px/1.3 var(--body);margin:18px 0 6px}
.eyebrow{font:700 12.5px/1.2 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted);font-size:15px}
.num{font:800 44px/1 var(--display);font-variant-numeric:tabular-nums}
.stack{display:grid;gap:16px}
.stack>*,.home>*{min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.narrow{max-width:680px}
.tag{display:inline-flex;align-self:flex-start;padding:4px 10px;border:2px solid var(--ink);border-radius:99px;background:var(--surface);font:700 12px/1.2 var(--body);letter-spacing:.08em;text-transform:uppercase}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;padding:10px 20px;border:var(--b);border-radius:16px;background:var(--yellow);box-shadow:var(--sh);color:var(--ink);font:800 19px/1.1 var(--display);text-align:center;transition:transform .08s,box-shadow .08s}
.btn:active:not(:disabled){transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn:disabled{opacity:.45;box-shadow:none}
.btn.lv{background:var(--lv,var(--cobalt));color:var(--ink)}
.btn.blue{background:var(--cobalt);color:#fff}
.btn.good{background:var(--mint)}
.btn.bad{background:var(--red)}
.btn.ghost{background:var(--surface)}
.btn.auto{width:auto}
.iconbtn{display:grid;place-items:center;width:46px;height:46px;border:var(--b);border-radius:13px;background:var(--surface);flex:none;font-size:20px}
.back{display:inline-flex;align-items:center;gap:8px;padding:8px 10px 8px 0;font:700 15px/1 var(--body)}
.card{background:var(--surface);border:var(--b);border-radius:20px;padding:18px;box-shadow:var(--sh-lg)}
.seg{display:flex;gap:4px;padding:4px;border:var(--b);border-radius:14px;background:var(--surface)}
.seg button{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;padding:10px 6px;border-radius:9px;font:700 15px/1 var(--body);text-align:center;white-space:nowrap}
.seg button[aria-selected="true"],.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.spk{display:grid;place-items:center;width:42px;height:42px;border:2px solid var(--ink);border-radius:50%;background:var(--yellow);font-size:17px;flex:none}
.spk:active{background:var(--pink)}

/* ---------- home ---------- */
.home{display:grid;gap:22px}
.hello{display:flex;flex-direction:column;gap:2px}
.cont{display:flex;flex-direction:column;gap:12px;width:100%;padding:20px;border:var(--b);border-radius:22px;background:var(--cobalt);color:#fff;box-shadow:var(--sh-lg);text-align:left;transition:transform .08s,box-shadow .08s}
.cont:active{transform:translate(4px,4px);box-shadow:2px 2px 0 var(--ink)}
.cont .tag{color:var(--ink)}
.cont .t{font:800 36px/1 var(--display);letter-spacing:-.025em;text-wrap:balance}
.cont .go{display:flex;justify-content:space-between;align-items:center;gap:12px}
.cont .play{display:grid;place-items:center;width:56px;height:56px;border:var(--b);border-radius:50%;background:var(--yellow);color:var(--ink);flex:none}
.cont .play .ic{fill:var(--ink);width:24px;height:24px}
.pbar{flex:1;height:14px;border:2px solid var(--ink);border-radius:99px;background:var(--surface);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--yellow);border-right:2px solid var(--ink)}
.pbar i[style*="width:0%"]{border:0}
.mission{display:grid;gap:12px}
.mission-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.mrow{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center}
.mbox{display:grid;place-items:center;width:34px;height:34px;border:var(--b);border-radius:10px;background:var(--surface)}
.mbox .ic{stroke-width:3.4;width:18px;height:18px}
.mrow.done .mbox{background:var(--mint)}
.mrow.done .mt{text-decoration:line-through;color:var(--muted)}
.mt{font-weight:600}
.mrow .pbar{height:10px;margin-top:6px}
.mrow .pbar i{background:var(--pink)}
.mrow.done .pbar i{background:var(--mint)}
.mn{font:800 16px/1 var(--display);font-variant-numeric:tabular-nums}
.chest{display:flex;align-items:center;gap:12px;padding:12px;border:var(--b);border-radius:14px;background:var(--soft)}
.chest .ic{width:30px;height:30px}
.chest.ready{background:var(--yellow);animation:wiggle 1.4s ease-in-out infinite}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{display:flex;flex-direction:column;gap:6px;padding:14px;border:var(--b);border-radius:18px;background:var(--tc,var(--surface));box-shadow:var(--sh);text-align:left;transition:transform .08s,box-shadow .08s}
.tile:active:not(:disabled){transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.tile:disabled{opacity:.55;box-shadow:none}
.tile .ic{width:28px;height:28px}
.tile b{font:800 18px/1.1 var(--display)}
.tile small{font-size:13.5px;font-weight:600}
.secthead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-top:8px}
.levels{display:grid;gap:18px}
.lvcard{border:var(--b);border-radius:22px;background:var(--surface);box-shadow:var(--sh-lg);overflow:hidden}
.lv-h{display:flex;gap:12px;align-items:center;padding:14px 16px;background:var(--lv);border-bottom:var(--b)}
.lv-h .lv-t{flex:1;min-width:0}
.lv-h p{font-size:14px;font-weight:600}
.roundel{display:grid;place-items:center;width:50px;height:50px;border:var(--b);border-radius:14px;background:var(--surface);font:800 20px/1 var(--display);flex:none}
.roundel.sm{width:38px;height:38px;font-size:16px;border-radius:11px}
.count{font:800 22px/1 var(--display);font-variant-numeric:tabular-nums}
.lrows{list-style:none;display:grid}
.lrow{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;width:100%;padding:12px 16px;border-bottom:2px dashed #cfd6d3;text-align:left}
li:last-child .lrow{border-bottom:0}
.lrow:hover{background:var(--soft)}
.lrow .n{display:grid;place-items:center;width:40px;height:40px;border:var(--b);border-radius:50%;background:var(--surface);font:800 17px/1 var(--display)}
.lrow b{display:block;font-weight:700;font-size:17px}
.lrow small{color:var(--muted);font-size:13.5px;font-weight:600}
.lrow.done .n{background:var(--lv)}
.lrow.cur{background:#fff7cf}
.lrow.cur .n{background:var(--yellow);animation:pulse 1.6s infinite}
.lrow .go{font:800 13px/1 var(--display);padding:6px 10px;border:2px solid var(--ink);border-radius:99px;background:var(--yellow)}
.lrow.test .n{border-radius:12px;background:var(--ink);color:#fff}
.lrow.test.done .n{background:var(--lv);color:var(--ink)}
.allbar{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.allbar span{height:14px;border:2px solid var(--ink);border-radius:5px;background:var(--surface);overflow:hidden}
.allbar i{display:block;height:100%;background:var(--lv)}
@media (min-width:920px){
  .home{grid-template-columns:minmax(0,1fr) 360px;gap:32px;align-items:start}
  .home .side{position:sticky;top:16px;order:2}
  h1{font-size:42px}
}

/* ---------- rings (result) ---------- */
.ring{position:relative;width:96px;height:96px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:11}
.ring .tr{stroke:var(--surface)}
.ring .fg{stroke:var(--lv,var(--cobalt));transition:stroke-dashoffset .6s}
.ring .lab{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .lab b{font:800 26px/1 var(--display);font-variant-numeric:tabular-nums}
.ring .lab span{font:600 11px/1.2 var(--body);color:var(--muted)}
.ring.big{width:136px;height:136px;border:var(--b);border-radius:50%;background:var(--surface);box-shadow:var(--sh)}
.ring.big .lab b{font-size:38px}

/* ---------- practice hub ---------- */
.tools{display:grid;gap:12px}
.tool{display:grid;grid-template-columns:48px 1fr auto;gap:14px;align-items:center;padding:14px;border:var(--b);border-radius:18px;background:var(--surface);box-shadow:var(--sh);width:100%;text-align:left;transition:transform .08s,box-shadow .08s}
.tool:active:not(:disabled){transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.tool .tic{display:grid;place-items:center;width:48px;height:48px;border:var(--b);border-radius:13px;background:var(--lv,var(--yellow));font-size:21px}
.tool b{display:block;font:800 18px/1.15 var(--display)}
.tool small{color:var(--muted);font-size:14px;font-weight:600}
.tool .meta{font:800 14px/1 var(--display);padding:6px 10px;border:2px solid var(--ink);border-radius:99px;background:var(--soft);white-space:nowrap}
.tool:disabled{opacity:.55;box-shadow:none}

/* ---------- lesson ---------- */
.lesson-h{display:flex;gap:14px;align-items:center;margin:6px 0 18px}
.lesson-h .roundel{background:var(--lv)}
.theory{overflow-x:auto}
.theory p{margin-bottom:10px}
.theory ul{padding-left:20px;margin:6px 0 12px}
.theory li{margin-bottom:5px}
.theory table{width:100%;border-collapse:collapse;margin:10px 0 14px;font-size:15px}
.theory th{font:700 12px/1.2 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:left}
.theory td,.theory th{padding:8px 10px 8px 0;border-bottom:2px dashed #cfd6d3;vertical-align:top}
.formula{margin:10px 0 14px;padding:12px 14px;border:var(--b);border-radius:12px;background:var(--lv,var(--yellow));font-weight:700}
.ex{display:flex;gap:14px;align-items:center;padding:13px 0;border-bottom:2px dashed #cfd6d3}
.ex:last-child{border-bottom:0}
.ex b{display:block;font-weight:700;font-size:17px}
.ex span{color:var(--muted);font-size:15px}
.types{list-style:none;display:flex;flex-wrap:wrap;gap:8px}
.types li{padding:6px 10px;border:2px solid var(--ink);border-radius:99px;background:var(--lv,var(--yellow));font:700 13px/1 var(--body)}

/* ---------- quiz ---------- */
.quiz{max-width:640px;margin:0 auto}
.qbar{display:flex;align-items:center;gap:10px;margin:2px 0 22px}
.blocks{flex:1;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:3px}
.blocks span{height:14px;border:2px solid var(--ink);border-radius:4px;background:var(--surface);transition:background .2s}
.blocks span.ok{background:var(--mint)}
.blocks span.no{background:var(--red)}
.blocks span.cur{background:var(--yellow)}
.prog{flex:1;height:16px;border:2px solid var(--ink);border-radius:99px;background:var(--surface);overflow:hidden}
.prog i{display:block;height:100%;background:var(--lv,var(--cobalt));transition:width .35s}
.qcount{font:800 16px/1 var(--display);font-variant-numeric:tabular-nums}
.combo{padding:6px 10px;border:2px solid var(--ink);border-radius:99px;background:var(--pink);font:800 14px/1 var(--display);white-space:nowrap;animation:pop .3s}
.confirm{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 14px;margin-bottom:18px;border:var(--b);border-radius:14px;background:var(--surface);font-weight:600}
.qtext{font:800 27px/1.2 var(--display);letter-spacing:-.015em;margin:10px 0 20px;text-wrap:pretty}
.blank{display:inline-block;min-width:58px;border-bottom:4px solid currentColor;margin:0 3px;transform:translateY(2px)}
.tstack{position:relative;margin:12px 4px 26px}
.tstack::before{content:"";position:absolute;inset:14px -6px -10px 10px;border:var(--b);border-radius:26px;background:var(--pink);transform:rotate(3.5deg)}
.tcard{position:relative;display:flex;flex-direction:column;gap:18px;min-height:240px;justify-content:space-between;padding:22px;border:var(--b);border-radius:26px;background:var(--yellow);box-shadow:var(--sh-lg);transition:transform .3s ease,background .2s}
.tcard .tq{margin:0;font:800 30px/1.12 var(--display);letter-spacing:-.02em}
.tcard.r{transform:rotate(5deg) translateX(12px)}
.tcard.l{transform:rotate(-5deg) translateX(-12px)}
.tcard.ok{background:var(--mint)}
.tcard.no{background:var(--red)}
.opts{display:grid;gap:12px}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:12px 16px;border:var(--b);border-radius:16px;background:var(--surface);box-shadow:var(--sh);font:700 18px/1.25 var(--body);transition:transform .08s,box-shadow .08s}
.opt:active:not(:disabled){transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.opt:hover:not(:disabled){background:#fffbe6}
.opt kbd{display:grid;place-items:center;width:28px;height:28px;border:2px solid var(--ink);border-radius:8px;font:800 14px/1 var(--display);flex:none}
.tf .opt{justify-content:center;min-height:66px;font:800 21px/1 var(--display)}
.tf .opt[data-v="0"]{background:var(--red)}
.tf .opt[data-v="1"]{background:var(--mint)}
.opt.right{background:var(--mint)}
.opt.wrong{background:var(--red);animation:shake .35s}
.opt:disabled:not(.right):not(.wrong){opacity:.5;box-shadow:none}
@media (hover:none){.opt kbd{display:none}}
.typer{display:grid;gap:14px}
.typer input{width:100%;min-height:60px;padding:12px 16px;border:var(--b);border-radius:16px;background:var(--surface);box-shadow:var(--sh);color:var(--ink);font:700 21px/1.2 var(--body)}
.typer input:focus{outline:none;background:#fffbe6}
.typer input.right{background:var(--mint)}
.typer input.wrong{background:var(--red);animation:shake .35s}
.slot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-height:70px;padding:10px 0 14px;margin-bottom:18px;border-bottom:3px dashed var(--ink)}
.slot .hint{color:var(--muted);font-size:15px;font-weight:600}
.slot .punct{font:800 26px/1 var(--display);margin-left:-2px}
.bank{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:22px;min-height:50px}
.word{padding:10px 14px;border:var(--b);border-radius:12px;background:var(--surface);box-shadow:3px 3px 0 var(--ink);font:700 17px/1.2 var(--body);animation:pop .16s}
.word:active:not(:disabled){transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.word.used{opacity:.2;box-shadow:none;animation:none}
#ord.locked{pointer-events:none}
#ord.right .slot .word{background:var(--mint)}
#ord.wrong .slot .word{background:var(--red)}
#ord.wrong .slot{animation:shake .35s}
.listen{display:flex;gap:10px;margin:10px 0 20px}
.fb{display:grid;gap:8px;margin-top:22px;padding:16px;border:var(--b);border-radius:18px;box-shadow:var(--sh);animation:rise .22s}
.fb.ok{background:var(--mint)}
.fb.no{background:#ffd3dc}
.fb-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font:800 26px/1 var(--display)}
.fb-h .plus{font-size:15px;padding:5px 10px;border:2px solid var(--ink);border-radius:99px;background:var(--yellow)}
.fb .btn{margin-top:6px}
.fb.ok .btn{background:var(--cobalt);color:#fff}
.skip{margin-top:14px}

/* ---------- result ---------- */
.res-top{display:flex;gap:20px;align-items:center;margin:14px 0 8px}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stats3 div{padding:12px;border:var(--b);border-radius:14px;background:var(--surface)}
.stats3 div:nth-child(1){background:var(--yellow)}
.stats3 div:nth-child(2){background:var(--pink)}
.stats3 dt{font:700 11.5px/1.2 var(--body);letter-spacing:.08em;text-transform:uppercase}
.stats3 dd{font:800 28px/1.1 var(--display);font-variant-numeric:tabular-nums;margin-top:4px}
.missed{list-style:none;display:grid;gap:10px}
.missed li{padding:12px 14px;border:var(--b);border-radius:14px;background:var(--surface)}
.missed b{display:inline-block;margin-top:4px;padding:2px 8px;border-radius:6px;background:var(--mint)}
.missed small{display:block;color:var(--muted);font-size:14px;margin-top:4px}
.newbadge{display:flex;gap:12px;align-items:center;padding:12px 14px;border:var(--b);border-radius:16px;background:var(--yellow);box-shadow:var(--sh);animation:pop .4s}
.newbadge .ic{font-size:28px}
.newbadge b{display:block;font:800 18px/1.1 var(--display)}
.newbadge span{font-size:14px;font-weight:600}

/* ---------- match ---------- */
.match{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.match .opt{justify-content:center;text-align:center;min-height:62px;padding:10px}
.match .opt.sel{background:var(--yellow);transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.match .opt.gone{opacity:.3;background:var(--mint);box-shadow:none}

/* ---------- flashcards ---------- */
.flip{perspective:1000px;margin:10px 0}
.flip-in{position:relative;display:block;width:100%;min-height:250px;transform-style:preserve-3d;transition:transform .45s}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:grid;place-content:center;gap:10px;text-align:center;padding:24px;border:var(--b);border-radius:24px;background:var(--surface);box-shadow:var(--sh-lg);backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.b{transform:rotateY(180deg);background:var(--lv)}
.face .w{font:800 40px/1.05 var(--display);letter-spacing:-.02em;text-wrap:balance}
.face .hint{font-size:14px;font-weight:600;color:var(--muted)}
.face.b .hint,.face.b .eyebrow{color:var(--ink)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* ---------- profile ---------- */
.rank{display:grid;gap:10px}
.bar{height:16px;border:2px solid var(--ink);border-radius:99px;background:var(--surface);overflow:hidden}
.bar i{display:block;height:100%;background:var(--yellow)}
.statgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:640px){.statgrid{grid-template-columns:repeat(4,1fr)}}
.statgrid div{padding:14px;border:var(--b);border-radius:16px;background:var(--surface)}
.statgrid div:nth-child(4n+1){background:var(--yellow)}
.statgrid div:nth-child(4n+2){background:var(--pink)}
.statgrid div:nth-child(4n+3){background:var(--lilac)}
.statgrid div:nth-child(4n){background:var(--mint)}
.statgrid dt{font:700 11.5px/1.2 var(--body);letter-spacing:.08em;text-transform:uppercase}
.statgrid dd{font:800 32px/1.1 var(--display);font-variant-numeric:tabular-nums;margin-top:4px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.badge{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;padding:12px;border:2.5px dashed #6b7470;border-radius:16px;color:var(--muted)}
.badge .bi{display:grid;place-items:center;width:40px;height:40px;border:2px dashed #6b7470;border-radius:50%;font-size:18px}
.badge b{display:block;font:800 15px/1.1 var(--display)}
.badge small{font-size:12.5px;line-height:1.3;display:block;font-weight:600}
.badge.on{border:var(--b);background:var(--surface);color:var(--ink);box-shadow:3px 3px 0 var(--ink)}
.badge.on .bi{border:var(--b);background:var(--yellow)}
.setting{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 0;border-bottom:2px dashed #cfd6d3}
.setting:last-child{border-bottom:0}
.setting .seg{min-width:210px}
.switch{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-weight:700}
.switch input{appearance:none;-webkit-appearance:none;width:52px;height:30px;border:var(--b);border-radius:99px;background:var(--surface);position:relative;cursor:pointer}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:21px;height:21px;border:2px solid var(--ink);border-radius:50%;background:var(--surface);box-sizing:border-box;transition:transform .15s}
.switch input:checked{background:var(--mint)}
.switch input:checked::after{transform:translateX(22px);background:var(--ink)}


/* ---------- reading / speaking / welcome / transfer ---------- */
.report{justify-self:start;font-size:14px;font-weight:600;color:var(--ink)}
.reading p{margin-bottom:14px;font-size:17.5px;line-height:1.7}
.reading p:last-child{margin-bottom:0}
.ctx{margin-bottom:16px;padding:10px 14px;border:var(--b);border-radius:14px;background:var(--surface)}
.ctx summary{font-weight:700;cursor:pointer;min-height:28px}
.ctx p{margin-top:8px;font-size:15px;line-height:1.6}
.dots{display:flex;gap:8px;flex-wrap:wrap}
.dots button{width:44px;height:16px;border:2px solid var(--ink);border-radius:99px;background:var(--surface)}
.dots button.ok{background:var(--mint)}
.dots button.cur{background:var(--yellow);box-shadow:2px 2px 0 var(--ink)}
.tcard.say{min-height:200px;background:var(--surface)}
.tcard.say.ok{background:var(--mint)}
.tcard.say.no{background:#ffd3dc}
.welcome{padding-top:12px}
.welcome h1{font-size:40px}
.perks{list-style:none;display:grid;gap:12px}
.perks li{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start;padding:14px;border:var(--b);border-radius:16px;background:var(--surface)}
.perks li .ic{width:44px;height:44px;padding:9px;border:2px solid var(--ink);border-radius:12px;background:var(--yellow)}
.perks li:nth-child(2) .ic{background:var(--pink)}
.perks li:nth-child(3) .ic{background:var(--mint)}
.goals{display:grid;gap:12px}
.goal{display:flex;flex-direction:column;gap:4px;width:100%;padding:16px 18px;border-radius:18px;background:var(--surface);text-align:left}
.goal b{font:800 22px/1.1 var(--display)}
.goal span{font-weight:600;color:var(--muted)}
.goal.on{background:var(--yellow)}
textarea{width:100%;padding:12px 14px;border:var(--b);border-radius:14px;background:var(--surface);color:var(--ink);font:500 14px/1.4 ui-monospace,Menlo,Consolas,monospace;resize:vertical;word-break:break-all}
textarea:focus{outline:none;background:#fffbe6}

@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(17,17,17,.45)}100%{box-shadow:0 0 0 12px rgba(17,17,17,0)}}
@keyframes wiggle{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(-2deg)}90%{transform:rotate(2deg)}95%{transform:rotate(-1deg)}}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes pop{0%{transform:scale(.85)}60%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes rise{from{transform:translateY(12px)}to{transform:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

<script>
const LEVELS = [
{id:"basic",name:"Basic",cefr:"A1",color:"#22a06b",desc:"Fondasi: to be, kalimat sederhana, kosakata sehari-hari.",lessons:[
 {id:"b1",title:"To Be & Pronouns",theory:`<p>Kata <b>to be</b> (am / is / are) dipakai untuk menyatakan identitas, sifat, keadaan, dan lokasi. Dalam bahasa Indonesia sering tidak diterjemahkan.</p>
<table><tr><th>Subjek</th><th>To be</th><th>Singkatan</th></tr>
<tr><td>I</td><td>am</td><td>I'm</td></tr><tr><td>He / She / It</td><td>is</td><td>he's, she's, it's</td></tr><tr><td>You / We / They</td><td>are</td><td>you're, we're, they're</td></tr></table>
<div class="formula">(+) S + am/is/are + ...<br>(−) S + am/is/are + not + ...<br>(?) Am/Is/Are + S + ...?</div>
<p class="muted">Tips: "is not" → isn't, "are not" → aren't. "am not" tidak disingkat menjadi "amn't".</p>`,
 examples:[["I am a student.","Saya seorang pelajar."],["She is happy today.","Dia senang hari ini."],["They are not at home.","Mereka tidak di rumah."],["Is he your brother?","Apakah dia saudara laki-lakimu?"]],
 vocab:[["student","pelajar"],["teacher","guru"],["happy","senang"],["tired","lelah"],["hungry","lapar"],["friend","teman"]],
 quiz:[{q:"She ___ a doctor.",o:["is","am","are","be"],e:"She (orang ketiga tunggal) memakai 'is'."},
 {q:"We ___ from Indonesia.",o:["are","is","am","be"],e:"We memakai 'are'."},
 {q:"___ you hungry?",o:["Are","Is","Am","Do"],e:"Kalimat tanya to be: Are + you."},
 {q:"Bentuk negatif dari 'I am tired' adalah…",o:["I am not tired.","I not tired.","I no am tired.","I don't tired."],e:"Negatif: tambahkan 'not' setelah to be."}]},
 {id:"b2",title:"Simple Present Tense",theory:`<p>Dipakai untuk <b>kebiasaan, rutinitas, dan fakta umum</b>.</p>
<div class="formula">(+) S + V1 (he/she/it + V-s/es)<br>(−) S + do/does + not + V1<br>(?) Do/Does + S + V1?</div>
<ul><li>Tambah <b>-es</b> untuk kata berakhiran -s, -sh, -ch, -x, -o: watch → watches, go → goes.</li>
<li>Konsonan + y → <b>-ies</b>: study → studies.</li>
<li>Setelah does / doesn't, kata kerja kembali ke bentuk dasar: <i>She doesn't <b>like</b></i>.</li></ul>
<p>Kata keterangan waktu: <i>always, usually, often, sometimes, never, every day</i>.</p>`,
 examples:[["I drink coffee every morning.","Saya minum kopi setiap pagi."],["He works in a bank.","Dia bekerja di bank."],["She doesn't like spicy food.","Dia tidak suka makanan pedas."],["Do you speak English?","Apakah kamu berbicara bahasa Inggris?"]],
 vocab:[["always","selalu"],["usually","biasanya"],["often","sering"],["sometimes","kadang-kadang"],["never","tidak pernah"],["wake up","bangun tidur"]],
 quiz:[{q:"He ___ to school every day.",o:["goes","go","going","gone"],e:"He + V-s/es → goes."},
 {q:"They ___ like cats.",o:["don't","doesn't","isn't","aren't"],e:"They memakai don't untuk kalimat negatif kata kerja."},
 {q:"___ she play the piano?",o:["Does","Do","Is","Are"],e:"She → Does + S + V1."},
 {q:"Water ___ at 100°C.",o:["boils","boil","boiling","is boil"],e:"Fakta umum, subjek tunggal → boils."}]},
 {id:"b3",title:"Articles & Plurals",theory:`<p><b>a / an</b> untuk benda tunggal yang belum spesifik. Pilihannya ditentukan oleh <b>bunyi</b>, bukan huruf.</p>
<ul><li><b>a</b> + bunyi konsonan: a book, a <b>u</b>niversity (bunyi "yu")</li>
<li><b>an</b> + bunyi vokal: an apple, an <b>h</b>our ("h" tidak dibaca)</li>
<li><b>the</b> untuk hal yang spesifik, sudah disebut, atau satu-satunya: the sun, the moon.</li></ul>
<h3>Bentuk jamak (plural)</h3>
<table><tr><th>Aturan</th><th>Contoh</th></tr><tr><td>+ s</td><td>book → books</td></tr><tr><td>+ es</td><td>box → boxes</td></tr><tr><td>y → ies</td><td>city → cities</td></tr><tr><td>Tidak beraturan</td><td>child → children, man → men, foot → feet, mouse → mice</td></tr></table>`,
 examples:[["I have a cat and an umbrella.","Saya punya seekor kucing dan sebuah payung."],["The cat is sleeping.","Kucing itu sedang tidur."],["She has two children.","Dia punya dua anak."],["It takes an hour.","Butuh waktu satu jam."]],
 vocab:[["umbrella","payung"],["hour","jam (durasi)"],["children","anak-anak"],["people","orang-orang"],["teeth","gigi (jamak)"],["women","para wanita"]],
 quiz:[{q:"I need ___ umbrella.",o:["an","a","the","(kosong)"],e:"'umbrella' diawali bunyi vokal → an."},
 {q:"She is ___ university student.",o:["a","an","the","(kosong)"],e:"'university' dibaca 'yu-' (bunyi konsonan) → a."},
 {q:"Bentuk jamak dari 'child' adalah…",o:["children","childs","childes","childrens"],e:"child → children (tidak beraturan)."},
 {q:"Look at ___ moon!",o:["the","a","an","(kosong)"],e:"Hanya ada satu bulan → the."}]},
 {id:"b4",title:"There is/are & Prepositions",theory:`<p><b>There is</b> + benda tunggal / tak terhitung. <b>There are</b> + benda jamak. Artinya "ada".</p>
<div class="formula">There is a book on the table.<br>There are three chairs in the room.</div>
<h3>Preposisi tempat</h3>
<table><tr><td><b>in</b></td><td>di dalam</td></tr><tr><td><b>on</b></td><td>di atas (menempel)</td></tr><tr><td><b>under</b></td><td>di bawah</td></tr><tr><td><b>next to</b></td><td>di sebelah</td></tr><tr><td><b>between</b></td><td>di antara (dua)</td></tr><tr><td><b>behind</b></td><td>di belakang</td></tr><tr><td><b>in front of</b></td><td>di depan</td></tr></table>`,
 examples:[["There is a cat under the bed.","Ada seekor kucing di bawah tempat tidur."],["There are many people in the park.","Ada banyak orang di taman."],["The bank is next to the school.","Bank berada di sebelah sekolah."],["Is there a pharmacy near here?","Apakah ada apotek di dekat sini?"]],
 vocab:[["near","dekat"],["far","jauh"],["behind","di belakang"],["between","di antara"],["pharmacy","apotek"],["fridge","kulkas"]],
 quiz:[{q:"There ___ two books on the table.",o:["are","is","am","be"],e:"two books (jamak) → there are."},
 {q:"There ___ some milk in the fridge.",o:["is","are","am","have"],e:"milk tak terhitung → there is."},
 {q:"The cat is ___ the table. (di bawah)",o:["under","on","in","between"],e:"di bawah = under."},
 {q:"The bank is ___ the school and the post office.",o:["between","next","behind of","among of"],e:"Di antara dua tempat → between."}]}
]},
{id:"elem",name:"Elementary",cefr:"A2",color:"#1e88e5",desc:"Bercerita tentang sekarang, masa lalu, dan rencana.",lessons:[
 {id:"e1",title:"Present Continuous",theory:`<p>Untuk aksi yang <b>sedang terjadi sekarang</b> atau rencana pasti dalam waktu dekat.</p>
<div class="formula">S + am/is/are + V-ing</div>
<ul><li>Penanda: now, right now, at the moment, Look!, Listen!</li>
<li><b>Stative verbs</b> (know, like, love, want, need, believe, understand) biasanya <u>tidak</u> memakai -ing: <i>I know</i>, bukan <i>I am knowing</i>.</li></ul>`,
 examples:[["I am reading a book now.","Saya sedang membaca buku sekarang."],["Listen! The baby is crying.","Dengar! Bayinya sedang menangis."],["We are meeting her tomorrow.","Kami akan bertemu dia besok."],["What are you doing?","Kamu sedang apa?"]],
 vocab:[["right now","saat ini juga"],["at the moment","saat ini"],["cry","menangis"],["wait","menunggu"],["cook","memasak"],["understand","memahami"]],
 quiz:[{q:"Listen! The baby ___.",o:["is crying","cries","cry","cried"],e:"'Listen!' → aksi sedang berlangsung."},
 {q:"I ___ the answer.",o:["know","am knowing","knowing","am know"],e:"'know' adalah stative verb, tidak pakai -ing."},
 {q:"They ___ TV right now.",o:["are watching","watch","is watching","watched"],e:"They + are + V-ing."},
 {q:"What ___ you doing?",o:["are","do","is","did"],e:"you + are + V-ing."}]},
 {id:"e2",title:"Simple Past Tense",theory:`<p>Untuk kejadian yang <b>sudah selesai di masa lalu</b> (yesterday, last week, ago, in 2010).</p>
<div class="formula">(+) S + V2<br>(−) S + did not (didn't) + V1<br>(?) Did + S + V1?</div>
<table><tr><th>Regular (+ed)</th><th>Irregular</th></tr>
<tr><td>work → worked</td><td>go → went</td></tr><tr><td>play → played</td><td>eat → ate</td></tr><tr><td>study → studied</td><td>see → saw</td></tr><tr><td>stop → stopped</td><td>buy → bought</td></tr></table>
<p class="muted">Ingat: setelah did/didn't, kata kerja kembali ke V1.</p>`,
 examples:[["We went to Bali last year.","Kami pergi ke Bali tahun lalu."],["I didn't see him yesterday.","Saya tidak melihatnya kemarin."],["Did you finish your homework?","Apakah kamu menyelesaikan PR-mu?"],["She bought a new phone.","Dia membeli ponsel baru."]],
 vocab:[["yesterday","kemarin"],["last night","tadi malam"],["ago","yang lalu"],["bought","membeli (V2)"],["brought","membawa (V2)"],["thought","berpikir (V2)"]],
 quiz:[{q:"We ___ to Bali last year.",o:["went","go","goes","gone"],e:"last year → simple past, go → went."},
 {q:"She didn't ___ the email.",o:["send","sent","sends","sending"],e:"Setelah didn't → V1."},
 {q:"___ you see the movie yesterday?",o:["Did","Do","Were","Was"],e:"Tanya simple past dengan kata kerja → Did."},
 {q:"Bentuk lampau dari 'buy' adalah…",o:["bought","buyed","brought","buy"],e:"buy → bought. (brought = bentuk lampau 'bring')."}]},
 {id:"e3",title:"Future: Will vs Going to",theory:`<table><tr><th>will</th><th>be going to</th></tr>
<tr><td>Keputusan spontan</td><td>Rencana yang sudah dibuat</td></tr>
<tr><td>Prediksi berdasar opini</td><td>Prediksi berdasar bukti yang terlihat</td></tr>
<tr><td>Janji, tawaran</td><td>—</td></tr></table>
<div class="formula">S + will + V1<br>S + am/is/are + going to + V1</div>`,
 examples:[["The phone is ringing. I'll answer it.","Teleponnya berdering. Biar saya angkat."],["Look at those clouds! It's going to rain.","Lihat awan itu! Akan hujan."],["We're going to visit Japan next month.","Kami akan ke Jepang bulan depan."],["I promise I won't be late.","Saya janji tidak akan terlambat."]],
 vocab:[["promise","janji"],["plan","rencana"],["next week","minggu depan"],["soon","segera"],["probably","mungkin sekali"],["decide","memutuskan"]],
 quiz:[{q:"Look at those dark clouds! It ___ rain.",o:["is going to","will","goes to","would"],e:"Ada bukti yang terlihat → going to."},
 {q:"\"The phone is ringing.\" \"I ___ answer it.\"",o:["will","am going to","going","am"],e:"Keputusan spontan → will."},
 {q:"I've bought tickets. We ___ visit Japan next month.",o:["are going to","will","go to","would"],e:"Rencana yang sudah dibuat → going to."},
 {q:"I promise I ___ tell anyone.",o:["won't","am not going","don't","not will"],e:"Janji → will / won't."}]},
 {id:"e4",title:"Comparatives & Superlatives",theory:`<table><tr><th>Jenis</th><th>Comparative</th><th>Superlative</th></tr>
<tr><td>1 suku kata</td><td>tall<b>er</b> than</td><td>the tall<b>est</b></td></tr>
<tr><td>Berakhiran -y</td><td>happ<b>ier</b></td><td>the happ<b>iest</b></td></tr>
<tr><td>2+ suku kata</td><td><b>more</b> expensive</td><td><b>the most</b> expensive</td></tr>
<tr><td>Tidak beraturan</td><td>good → better, bad → worse</td><td>the best, the worst</td></tr></table>
<p><b>as + adj + as</b> = sama: <i>She is as tall as me.</i></p>`,
 examples:[["Jakarta is bigger than Bandung.","Jakarta lebih besar dari Bandung."],["This is the most interesting book I've read.","Ini buku paling menarik yang pernah saya baca."],["My English is better than last year.","Bahasa Inggris saya lebih baik dari tahun lalu."],["He is as tall as his father.","Dia setinggi ayahnya."]],
 vocab:[["cheap","murah"],["expensive","mahal"],["better","lebih baik"],["worse","lebih buruk"],["crowded","ramai/padat"],["comfortable","nyaman"]],
 quiz:[{q:"Jakarta is ___ than Bandung.",o:["bigger","big","biggest","more big"],e:"Kata pendek → -er + than."},
 {q:"This is the ___ book I've ever read.",o:["most interesting","more interesting","interesting","interestingest"],e:"Kata panjang + superlative → the most."},
 {q:"My English is ___ than last year.",o:["better","gooder","best","more good"],e:"good → better (tidak beraturan)."},
 {q:"She is as tall ___ her brother.",o:["as","than","like","so"],e:"Pola: as + adj + as."}]}
]},
{id:"inter",name:"Intermediate",cefr:"B1",color:"#8e44ad",desc:"Present perfect, modal, kalimat pengandaian, pasif.",lessons:[
 {id:"i1",title:"Present Perfect",theory:`<div class="formula">S + have/has + V3</div>
<p>Dipakai untuk:</p><ul><li><b>Pengalaman</b> (tanpa waktu spesifik): I have been to Japan.</li>
<li><b>Hasil yang terasa sekarang</b>: I've lost my keys.</li>
<li><b>Durasi sampai sekarang</b> dengan <b>for</b> (lamanya) / <b>since</b> (titik awal).</li></ul>
<p class="muted">Jika ada waktu spesifik di masa lalu (yesterday, in 2019), gunakan <b>simple past</b>.</p>`,
 examples:[["I have been to London twice.","Saya pernah ke London dua kali."],["She has lived here since 2020.","Dia tinggal di sini sejak 2020."],["We've known each other for ten years.","Kami sudah saling kenal sepuluh tahun."],["Have you ever eaten durian?","Pernahkah kamu makan durian?"]],
 vocab:[["ever","pernah"],["never","tidak pernah"],["already","sudah"],["yet","belum/sudah (tanya)"],["just","baru saja"],["since","sejak"]],
 quiz:[{q:"I ___ to London twice.",o:["have been","went","have gone","was"],e:"Pengalaman tanpa waktu spesifik → have been."},
 {q:"She ___ here since 2020.",o:["has lived","lives","lived","is living"],e:"since + durasi hingga kini → present perfect."},
 {q:"I ___ him yesterday.",o:["saw","have seen","have saw","seen"],e:"'yesterday' = waktu spesifik → simple past."},
 {q:"We have known each other ___ ten years.",o:["for","since","ago","during"],e:"Lamanya waktu → for."}]},
 {id:"i2",title:"Modal Verbs",theory:`<table><tr><th>Modal</th><th>Fungsi</th></tr>
<tr><td><b>can</b></td><td>kemampuan, izin</td></tr><tr><td><b>should</b></td><td>saran ("sebaiknya")</td></tr>
<tr><td><b>must</b></td><td>keharusan (dari pembicara/aturan)</td></tr><tr><td><b>have to</b></td><td>keharusan dari luar</td></tr>
<tr><td><b>mustn't</b></td><td>dilarang</td></tr><tr><td><b>don't have to</b></td><td>tidak perlu (boleh saja)</td></tr></table>
<div class="formula">S + modal + V1 (tanpa "to", kecuali have to)</div>`,
 examples:[["You mustn't smoke here.","Kamu dilarang merokok di sini."],["You don't have to come early.","Kamu tidak perlu datang lebih awal."],["You should drink more water.","Sebaiknya kamu minum lebih banyak air."],["Can I borrow your pen?","Boleh saya pinjam pulpenmu?"]],
 vocab:[["allowed","diizinkan"],["forbidden","dilarang"],["borrow","meminjam"],["advice","saran"],["necessary","perlu"],["rule","aturan"]],
 quiz:[{q:"You ___ smoke here. It's forbidden.",o:["mustn't","don't have to","shouldn't to","can"],e:"Dilarang → mustn't."},
 {q:"It's Sunday. I ___ go to work.",o:["don't have to","mustn't","can't","shouldn't"],e:"Tidak perlu (bukan dilarang) → don't have to."},
 {q:"You look tired. You ___ get some rest.",o:["should","must to","can","would"],e:"Saran → should."},
 {q:"___ you swim?",o:["Can","Must","Should","Have"],e:"Menanyakan kemampuan → Can."}]},
 {id:"i3",title:"Conditionals 0 & 1",theory:`<table><tr><th>Tipe</th><th>Pola</th><th>Fungsi</th></tr>
<tr><td>Zero</td><td>If + present, present</td><td>Fakta / hukum alam</td></tr>
<tr><td>First</td><td>If + present, will + V1</td><td>Kemungkinan nyata di masa depan</td></tr></table>
<p class="muted">Jangan pakai "will" di klausa if: <i>If it <b>rains</b></i>, bukan <i>If it will rain</i>. <b>Unless</b> = if … not.</p>`,
 examples:[["If you heat ice, it melts.","Jika es dipanaskan, ia mencair."],["If it rains tomorrow, we'll stay home.","Jika besok hujan, kami akan di rumah."],["Unless you hurry, you'll miss the bus.","Kalau tidak buru-buru, kamu akan ketinggalan bus."],["If I see her, I'll tell her.","Kalau saya bertemu dia, akan saya beri tahu."]],
 vocab:[["unless","kecuali jika"],["heat","memanaskan"],["melt","mencair"],["miss","ketinggalan"],["hurry","bergegas"],["pass","lulus"]],
 quiz:[{q:"If you heat ice, it ___.",o:["melts","melt","will melted","melted"],e:"Fakta → zero conditional (present)."},
 {q:"If it rains tomorrow, we ___ at home.",o:["will stay","stay","stayed","would stay"],e:"First conditional → will + V1."},
 {q:"If she ___ hard, she will pass.",o:["studies","study","will study","studied"],e:"Klausa if memakai present simple."},
 {q:"Unless you hurry, you ___ the bus.",o:["will miss","miss","missed","would miss"],e:"Unless = if not → first conditional."}]},
 {id:"i4",title:"Passive Voice",theory:`<p>Dipakai saat <b>objek/aksi lebih penting</b> daripada pelakunya.</p>
<div class="formula">S + be + V3 (+ by …)</div>
<table><tr><th>Tense</th><th>Aktif</th><th>Pasif</th></tr>
<tr><td>Present</td><td>They clean the room.</td><td>The room <b>is cleaned</b>.</td></tr>
<tr><td>Past</td><td>They built it in 1990.</td><td>It <b>was built</b> in 1990.</td></tr>
<tr><td>Future</td><td>They will open it.</td><td>It <b>will be opened</b>.</td></tr></table>`,
 examples:[["English is spoken all over the world.","Bahasa Inggris digunakan di seluruh dunia."],["The bridge was built in 1990.","Jembatan itu dibangun tahun 1990."],["The letters were sent yesterday.","Surat-surat itu dikirim kemarin."],["The results will be announced soon.","Hasilnya akan segera diumumkan."]],
 vocab:[["build","membangun"],["announce","mengumumkan"],["invent","menemukan"],["produce","memproduksi"],["deliver","mengantar"],["repair","memperbaiki"]],
 quiz:[{q:"English ___ all over the world.",o:["is spoken","speaks","is speaking","spoke"],e:"Pasif present: is + V3."},
 {q:"The bridge ___ in 1990.",o:["was built","built","is built","was build"],e:"Pasif past: was + V3 (built)."},
 {q:"The letters ___ by the secretary yesterday.",o:["were typed","was typed","typed","are typed"],e:"letters (jamak) + past → were + V3."},
 {q:"Bentuk pasif dari 'They clean the room every day':",o:["The room is cleaned every day.","The room cleaned every day.","The room was cleaned every day.","The room is clean every day."],e:"Present simple → is + V3."}]}
]},
{id:"upper",name:"Upper-Intermediate",cefr:"B2",color:"#e67e22",desc:"Pengandaian tak nyata, kalimat tak langsung, klausa relatif.",lessons:[
 {id:"u1",title:"Conditionals 2 & 3",theory:`<table><tr><th>Tipe</th><th>Pola</th><th>Fungsi</th></tr>
<tr><td>Second</td><td>If + V2, would + V1</td><td>Tidak nyata di masa kini</td></tr>
<tr><td>Third</td><td>If + had + V3, would have + V3</td><td>Tidak nyata di masa lalu (penyesalan)</td></tr></table>
<p>Pada second conditional, gunakan <b>were</b> untuk semua subjek (lebih baku): <i>If I were you…</i></p>`,
 examples:[["If I were rich, I would travel the world.","Seandainya saya kaya, saya akan keliling dunia."],["If I were you, I'd apologize.","Kalau saya jadi kamu, saya akan minta maaf."],["If she had studied, she would have passed.","Seandainya dia belajar, dia pasti lulus."],["We would have come if you had invited us.","Kami pasti datang kalau kamu mengundang kami."]],
 vocab:[["regret","menyesal"],["apologize","meminta maaf"],["afford","mampu (membeli)"],["opportunity","kesempatan"],["imagine","membayangkan"],["otherwise","jika tidak"]],
 quiz:[{q:"If I ___ rich, I would travel the world.",o:["were","am","will be","had been"],e:"Second conditional → if + were."},
 {q:"If she had studied, she ___ the exam.",o:["would have passed","would pass","will pass","passed"],e:"Third conditional → would have + V3."},
 {q:"If I ___ you, I'd apologize.",o:["were","am","was being","be"],e:"Ungkapan saran: If I were you."},
 {q:"We would have come if you ___ us.",o:["had invited","invited","would invite","have invited"],e:"Third conditional → if + had + V3."}]},
 {id:"u2",title:"Reported Speech",theory:`<p>Saat melaporkan ucapan orang lain, tense biasanya <b>mundur satu langkah</b>.</p>
<table><tr><th>Langsung</th><th>Tidak langsung</th></tr>
<tr><td>present</td><td>past</td></tr><tr><td>past / present perfect</td><td>past perfect</td></tr>
<tr><td>will / can</td><td>would / could</td></tr><tr><td>now / today / tomorrow</td><td>then / that day / the next day</td></tr></table>
<p><b>Pertanyaan:</b> pakai <i>if/whether</i> (ya/tidak) atau kata tanya, lalu susunan kalimat berita: <i>She asked where I <b>lived</b></i>.</p>`,
 examples:[["She said (that) she was tired.","Dia bilang dia lelah."],["He said he would call me.","Dia bilang akan meneleponku."],["She asked me where I lived.","Dia bertanya di mana saya tinggal."],["He asked if I was ready.","Dia bertanya apakah saya sudah siap."]],
 vocab:[["mention","menyebutkan"],["explain","menjelaskan"],["claim","mengklaim"],["admit","mengakui"],["deny","menyangkal"],["whether","apakah"]],
 quiz:[{q:"\"I am tired.\" → She said that she ___ tired.",o:["was","is","has been","were"],e:"present → past (am → was)."},
 {q:"\"I will call you.\" → He said he ___ call me.",o:["would","will","can","shall"],e:"will → would."},
 {q:"\"Where do you live?\" → She asked me where ___.",o:["I lived","do I live","did I live","I live"],e:"Susunan kalimat berita + tense mundur."},
 {q:"\"Are you ready?\" → He asked ___ I was ready.",o:["if","that","what","do"],e:"Pertanyaan ya/tidak → if / whether."}]},
 {id:"u3",title:"Relative Clauses",theory:`<table><tr><th>Kata</th><th>Untuk</th></tr>
<tr><td><b>who</b></td><td>orang</td></tr><tr><td><b>which</b></td><td>benda/hewan</td></tr><tr><td><b>that</b></td><td>orang/benda (hanya defining)</td></tr>
<tr><td><b>whose</b></td><td>kepemilikan</td></tr><tr><td><b>where</b></td><td>tempat</td></tr></table>
<p><b>Defining</b>: informasi penting, tanpa koma. <b>Non-defining</b>: informasi tambahan, diapit koma, <u>tidak boleh</u> memakai "that".</p>`,
 examples:[["The man who lives next door is a pilot.","Pria yang tinggal di sebelah adalah pilot."],["This is the house where I grew up.","Ini rumah tempat saya dibesarkan."],["The girl whose bag was stolen called the police.","Gadis yang tasnya dicuri menelepon polisi."],["My car, which is very old, still runs well.","Mobil saya, yang sudah sangat tua, masih berjalan baik."]],
 vocab:[["neighbour","tetangga"],["grow up","tumbuh besar"],["steal","mencuri"],["own","memiliki"],["recommend","merekomendasikan"],["whose","yang … -nya"]],
 quiz:[{q:"The man ___ lives next door is a pilot.",o:["who","which","whose","where"],e:"Orang → who."},
 {q:"This is the house ___ I grew up.",o:["where","which","who","whose"],e:"Tempat → where."},
 {q:"The girl ___ bag was stolen called the police.",o:["whose","who","which","whom"],e:"Kepemilikan → whose."},
 {q:"My car, ___ is very old, still runs well.",o:["which","that","who","what"],e:"Non-defining (pakai koma) → which, bukan that."}]},
 {id:"u4",title:"Gerund vs Infinitive",theory:`<table><tr><th>+ V-ing (gerund)</th><th>+ to V1 (infinitive)</th></tr>
<tr><td>enjoy, avoid, finish, mind, suggest, keep, consider</td><td>want, decide, hope, plan, agree, refuse, manage</td></tr>
<tr><td>setelah preposisi: interested <b>in</b> learning</td><td>setelah adjektif: easy <b>to</b> learn</td></tr></table>
<h3>Arti berubah</h3><ul><li><b>stop smoking</b> = berhenti merokok · <b>stop to smoke</b> = berhenti (sejenak) untuk merokok</li>
<li><b>remember locking</b> = ingat sudah mengunci · <b>remember to lock</b> = ingat untuk mengunci</li></ul>
<p class="muted">Jebakan: <i>look forward to <b>seeing</b></i> — "to" di sini adalah preposisi.</p>`,
 examples:[["I enjoy reading novels.","Saya suka membaca novel."],["She decided to study abroad.","Dia memutuskan kuliah di luar negeri."],["He stopped smoking last year.","Dia berhenti merokok tahun lalu."],["I'm looking forward to seeing you.","Saya menantikan bertemu denganmu."]],
 vocab:[["avoid","menghindari"],["consider","mempertimbangkan"],["refuse","menolak"],["manage","berhasil (melakukan)"],["abroad","luar negeri"],["look forward to","menantikan"]],
 quiz:[{q:"I enjoy ___ novels.",o:["reading","to read","read","reads"],e:"enjoy + V-ing."},
 {q:"She decided ___ abroad.",o:["to study","studying","study","studied"],e:"decide + to V1."},
 {q:"He stopped ___ — now he's healthier. (berhenti merokok)",o:["smoking","to smoke","smoke","smoked"],e:"stop + V-ing = berhenti melakukan."},
 {q:"I'm looking forward to ___ you.",o:["seeing","see","to see","saw"],e:"'to' di sini preposisi → V-ing."}]}
]},
{id:"adv",name:"Advanced",cefr:"C1",color:"#c0392b",desc:"Struktur penekanan, inversi, phrasal verbs, bahasa natural.",lessons:[
 {id:"a1",title:"Inversion",theory:`<p>Inversi (membalik subjek–kata bantu) dipakai untuk <b>penekanan</b> dan gaya <b>formal</b>, setelah kata keterangan negatif/terbatas.</p>
<div class="formula">Negative adverb + auxiliary + S + V</div>
<ul><li><b>Never</b> have I seen such a view.</li><li><b>Rarely</b> does she complain.</li>
<li><b>Not only</b> was he late, <b>but</b> he also forgot his notes.</li>
<li><b>No sooner</b> had we arrived <b>than</b> it started to rain.</li><li><b>Hardly</b> had I sat down <b>when</b> the phone rang.</li></ul>
<h3>Conditional tanpa "if"</h3><ul><li><b>Had</b> I known… (= If I had known)</li><li><b>Should</b> you need help… (= If you need)</li><li><b>Were</b> I in your position… (= If I were)</li></ul>`,
 examples:[["Never have I seen such a beautiful sunset.","Belum pernah saya melihat matahari terbenam seindah ini."],["Had I known, I would have helped.","Seandainya saya tahu, saya pasti membantu."],["Should you need anything, please call me.","Jika Anda membutuhkan sesuatu, silakan hubungi saya."],["Rarely do we get such an opportunity.","Jarang sekali kita mendapat kesempatan seperti ini."]],
 vocab:[["rarely","jarang"],["seldom","jarang sekali"],["hardly","hampir tidak"],["under no circumstances","dalam keadaan apa pun tidak"],["little did I know","sama sekali tidak saya sangka"],["only then","barulah saat itu"]],
 quiz:[{q:"Never ___ such a beautiful sunset.",o:["have I seen","I have seen","I saw","did I seen"],e:"Never + auxiliary + subjek."},
 {q:"___ I known, I would have helped.",o:["Had","If","Have","Did"],e:"Had I known = If I had known."},
 {q:"Not only ___ late, but he also forgot his notes.",o:["was he","he was","he is","did he"],e:"Not only + inversi (was he)."},
 {q:"No sooner had we arrived ___ it started to rain.",o:["than","when","then","that"],e:"Pasangan tetap: No sooner … than."}]},
 {id:"a2",title:"Wish, If only & Mixed Conditionals",theory:`<table><tr><th>Pola</th><th>Fungsi</th></tr>
<tr><td>wish + V2 / were</td><td>berharap keadaan sekarang berbeda</td></tr>
<tr><td>wish + had + V3</td><td>menyesali masa lalu</td></tr>
<tr><td>wish + would + V1</td><td>kesal pada perilaku orang lain</td></tr></table>
<p><b>If only</b> = wish, tetapi lebih emosional.</p>
<h3>Mixed conditional</h3><p>Masa lalu → akibat sekarang: <i>If I <b>had taken</b> that job, I <b>would be</b> rich now.</i><br>Sekarang → akibat masa lalu: <i>If I <b>were</b> braver, I <b>would have spoken</b> up.</i></p>`,
 examples:[["I wish I were taller.","Andai saya lebih tinggi."],["I wish I hadn't said that.","Andai saya tidak mengatakan itu."],["If only you would listen!","Andai saja kamu mau mendengarkan!"],["If I had saved money, I wouldn't be broke now.","Kalau dulu saya menabung, sekarang saya tidak bokek."]],
 vocab:[["if only","andai saja"],["broke","bokek"],["speak up","bersuara"],["brave","berani"],["save","menabung"],["complain","mengeluh"]],
 quiz:[{q:"I wish I ___ taller.",o:["were","am","will be","have been"],e:"Harapan tentang sekarang → were."},
 {q:"I wish I ___ that. It was a mistake.",o:["hadn't said","didn't say","wouldn't say","don't say"],e:"Penyesalan masa lalu → had + V3."},
 {q:"If I had taken that job, I ___ in London now.",o:["would be living","would have lived","will live","am living"],e:"Mixed: masa lalu → hasil sekarang (would + V1)."},
 {q:"I wish you ___ making that noise!",o:["would stop","stopped","had stopped","will stop"],e:"Kesal pada kebiasaan orang lain → wish + would."}]},
 {id:"a3",title:"Phrasal Verbs Penting",theory:`<p>Phrasal verb = kata kerja + partikel, artinya sering <b>tidak bisa ditebak</b> dari kata per kata. Sangat umum dalam percakapan.</p>
<table><tr><td><b>put off</b></td><td>menunda</td></tr><tr><td><b>come up with</b></td><td>memunculkan (ide)</td></tr>
<tr><td><b>turn down</b></td><td>menolak (tawaran)</td></tr><tr><td><b>run out of</b></td><td>kehabisan</td></tr>
<tr><td><b>look into</b></td><td>menyelidiki</td></tr><tr><td><b>get along with</b></td><td>akur dengan</td></tr>
<tr><td><b>bring up</b></td><td>mengungkit / membesarkan (anak)</td></tr><tr><td><b>figure out</b></td><td>memahami / menemukan jawaban</td></tr></table>`,
 examples:[["We need to come up with a better plan.","Kita perlu menemukan rencana yang lebih baik."],["The meeting was put off until next week.","Rapat ditunda hingga minggu depan."],["She turned down the job offer.","Dia menolak tawaran kerja itu."],["We've run out of milk.","Kita kehabisan susu."]],
 vocab:[["put off","menunda"],["turn down","menolak"],["run out of","kehabisan"],["figure out","memecahkan"],["look into","menyelidiki"],["get along with","akur dengan"]],
 quiz:[{q:"We need to ___ a better plan.",o:["come up with","come down to","put up","look after"],e:"come up with = memunculkan ide."},
 {q:"The meeting was ___ until next week.",o:["put off","put on","taken off","called up"],e:"put off = menunda."},
 {q:"She ___ the job offer because the salary was low.",o:["turned down","turned up","gave in","looked down"],e:"turn down = menolak."},
 {q:"We've ___ milk. Can you buy some?",o:["run out of","run into","run over","run away"],e:"run out of = kehabisan."}]},
 {id:"a4",title:"Cleft Sentences (Penekanan)",theory:`<p>Kalimat cleft memecah kalimat untuk <b>menonjolkan</b> satu bagian.</p>
<div class="formula">It + be + [bagian yang ditekankan] + that/who …<br>What + S + V + be + [penekanan]</div>
<ul><li>John broke the vase. → <b>It was John who</b> broke the vase.</li>
<li>I need a holiday. → <b>What I need is</b> a holiday.</li>
<li><b>All I want is</b> some peace and quiet.</li><li><b>The reason why</b> I left <b>is that</b> …</li></ul>`,
 examples:[["It was Sarah who found the keys.","Sarah-lah yang menemukan kuncinya."],["What I need is a long holiday.","Yang saya butuhkan adalah liburan panjang."],["All I want is some peace and quiet.","Yang saya mau hanyalah ketenangan."],["It was in Bali that I lost my phone.","Di Bali-lah saya kehilangan ponsel."]],
 vocab:[["emphasise","menekankan"],["peace and quiet","ketenangan"],["the thing is","masalahnya adalah"],["what matters is","yang penting adalah"],["vase","vas bunga"],["reason","alasan"]],
 quiz:[{q:"___ I need is a long holiday.",o:["What","That","Which","It"],e:"Pola: What + S + V + is …"},
 {q:"It was Sarah ___ found the keys.",o:["who","which","what","whom"],e:"It was + orang + who."},
 {q:"All I want ___ some peace and quiet.",o:["is","are","be","being"],e:"'All I want' dianggap tunggal → is."},
 {q:"Menekankan tempat dari 'I lost my phone in Bali':",o:["It was in Bali that I lost my phone.","It is Bali which I lost my phone.","What I lost was in Bali my phone.","Bali was where lost my phone."],e:"It was + [penekanan] + that + sisa kalimat."}]}
]},
{id:"expert",name:"Expert",cefr:"C2",color:"#2c3e50",desc:"Idiom, register formal, kolokasi, dan gaya akademik.",lessons:[
 {id:"x1",title:"Idioms Populer",theory:`<p>Idiom membuat bahasa Anda terdengar <b>natural seperti penutur asli</b>. Artinya tidak harfiah.</p>
<table><tr><td><b>a piece of cake</b></td><td>sangat mudah</td></tr><tr><td><b>break the ice</b></td><td>mencairkan suasana</td></tr>
<tr><td><b>under the weather</b></td><td>kurang enak badan</td></tr><tr><td><b>once in a blue moon</b></td><td>sangat jarang</td></tr>
<tr><td><b>cost an arm and a leg</b></td><td>sangat mahal</td></tr><tr><td><b>beat around the bush</b></td><td>berbelit-belit</td></tr>
<tr><td><b>hit the nail on the head</b></td><td>tepat sasaran</td></tr><tr><td><b>the ball is in your court</b></td><td>giliran Anda memutuskan</td></tr></table>`,
 examples:[["The exam was a piece of cake.","Ujiannya gampang sekali."],["I'm feeling a bit under the weather.","Saya agak kurang enak badan."],["That car cost an arm and a leg.","Mobil itu mahal sekali."],["Stop beating around the bush and tell me.","Jangan berbelit-belit, katakan saja."]],
 vocab:[["a piece of cake","sangat mudah"],["break the ice","mencairkan suasana"],["under the weather","kurang enak badan"],["once in a blue moon","sangat jarang"],["cost an arm and a leg","sangat mahal"],["hit the nail on the head","tepat sasaran"]],
 quiz:[{q:"\"The exam was a piece of cake\" artinya…",o:["Ujiannya sangat mudah","Ujiannya sangat sulit","Ujiannya enak","Ujiannya membosankan"],e:"a piece of cake = sangat mudah."},
 {q:"\"I'm feeling under the weather\" artinya…",o:["Saya kurang enak badan","Saya kehujanan","Saya senang","Saya kedinginan di luar"],e:"under the weather = sedikit sakit."},
 {q:"\"Stop beating around the bush!\" artinya…",o:["Langsung ke intinya!","Berhenti berkebun!","Berhenti berbohong!","Berhenti mengeluh!"],e:"beat around the bush = berbelit-belit."},
 {q:"\"We eat out once in a blue moon\" artinya…",o:["Sangat jarang","Setiap bulan purnama","Setiap malam","Saat hujan"],e:"once in a blue moon = sangat jarang."}]},
 {id:"x2",title:"Subjunctive & Register Formal",theory:`<p><b>Subjunctive</b>: setelah kata seperti <i>suggest, recommend, insist, demand, essential, vital</i> + <b>that</b>, gunakan <b>bentuk dasar</b> kata kerja untuk semua subjek.</p>
<div class="formula">It is essential that he <u>be</u> on time.<br>The doctor recommended that she <u>stop</u> smoking.</div>
<h3>Informal → Formal</h3>
<table><tr><td>get</td><td>obtain</td></tr><tr><td>ask for</td><td>request</td></tr><tr><td>help</td><td>assist</td></tr>
<tr><td>buy</td><td>purchase</td></tr><tr><td>need</td><td>require</td></tr><tr><td>find out</td><td>ascertain / determine</td></tr></table>`,
 examples:[["The board insisted that he be present.","Dewan bersikeras agar dia hadir."],["It is vital that every applicant submit the form.","Sangat penting setiap pelamar menyerahkan formulir."],["Please do not hesitate to contact us.","Jangan ragu untuk menghubungi kami."],["We regret to inform you that…","Dengan berat hati kami sampaikan bahwa…"]],
 vocab:[["obtain","memperoleh"],["request","meminta"],["assist","membantu"],["purchase","membeli"],["require","membutuhkan"],["ascertain","memastikan"]],
 quiz:[{q:"The doctor recommended that he ___ smoking.",o:["stop","stops","stopped","will stop"],e:"Subjunctive → bentuk dasar (stop)."},
 {q:"It is essential that every student ___ on time.",o:["be","is","was","being"],e:"essential that + be."},
 {q:"Padanan formal dari 'find out' adalah…",o:["ascertain","figure","look","discover out"],e:"find out → ascertain / determine."},
 {q:"I insist that he ___ informed.",o:["be","is","was","will be"],e:"insist that + bentuk dasar (be)."}]},
 {id:"x3",title:"Collocations & Nuance",theory:`<p><b>Kolokasi</b> = pasangan kata yang lazim dipakai bersama. Salah kolokasi terdengar janggal meski tata bahasanya benar.</p>
<table><tr><th>make</th><th>do</th></tr><tr><td>a decision, a mistake, progress, an effort</td><td>homework, business, research, a favour</td></tr></table>
<p>Lainnya: <b>heavy</b> rain, <b>strong</b> coffee, <b>highly</b> unlikely, <b>deeply</b> concerned, <b>bitterly</b> disappointed.</p>
<h3>Kata yang sering tertukar</h3><ul><li><b>economic</b> (terkait ekonomi) vs <b>economical</b> (hemat)</li>
<li><b>affect</b> (kata kerja: memengaruhi) vs <b>effect</b> (kata benda: dampak)</li>
<li><b>sensible</b> (masuk akal) vs <b>sensitive</b> (peka)</li></ul>`,

<ul><li>This <b>suggests</b> that… (bukan "This proves…")</li><li>It <b>appears</b> that… / X <b>tends to</b>…</li><li><b>To some extent</b>, … / <b>Arguably</b>, …</li></ul>`,

/* ================= quiz engine ================= */
const PRAISE = ["Benar!", "Tepat!", "Mantap!", "Bagus!", "Keren!"];
const QLABEL = { m: "Pilih jawaban yang tepat", t: "Ketik jawabannya", f: "Benar atau salah?", o: "Susun kalimat bahasa Inggrisnya", l: "Dengarkan, lalu susun kalimatnya" };
const answerOf = q => q.t === "m" ? q.o[0] : q.t === "t" ? q.a[0] : q.t === "f" ? (q.a ? "Benar" : "Salah") : q.s;
const norm = s => String(s).toLowerCase().replace(/[‘’`]/g, "'").replace(/\s+/g, " ").trim().replace(/[.!?]+$/, "");
const CONTR = [[/\bcan't\b/g, ["cannot", "can not"]], [/\bwon't\b/g, ["will not"]], [/n't\b/g, [" not"]], [/'re\b/g, [" are"]], [/'m\b/g, [" am"]], [/'ve\b/g, [" have"]], [/'ll\b/g, [" will"]], [/'d\b/g, [" would", " had"]], [/'s\b/g, [" is", " has"]]];
function variants(x) {
  const set = new Set([norm(x)]);
  CONTR.forEach(([re, alts]) => [...set].forEach(v => { re.lastIndex = 0; if (re.test(v)) alts.forEach(a => { re.lastIndex = 0; set.add(v.replace(re, a).replace(/\s+/g, " ").trim()); }); }));
  return set;
}
const accepts = (answers, user) => { const u = variants(user); return answers.some(a => [...variants(a)].some(v => u.has(v))); };
const reportUrl = c => REPO + "/issues/new?title=" + encodeURIComponent("Laporan soal " + (c.key || "")) + "&body=" + encodeURIComponent("Soal: " + (c.q || c.tr || c.s) + "\nKunci jawaban: " + answerOf(c) + "\n\nMasalahnya:\n");
const fmtQ = s => esc(s).replace(/___/g, '<span class="blank"></span>');

function runQuiz(items, o) {
  if (!items.length) return o.back();
  clearInterval(TICK); TICK = null; stopSpeak();
  document.body.classList.add("focus");
  const N = items.length, lv = o.li != null ? ` style="--lv:var(--l${o.li + 1})"` : "";
  let i = 0, right = 0, combo = 0, maxCombo = 0, gained = 0, answered = false, st = {};
  const missed = [], res = [];
  const comboHTML = () => combo >= 3 ? `<span class="combo">${combo}× combo</span>` : "";

  function drawOrd() {
    const used = new Set(st.ans);
    $("#ord").innerHTML = `<div class="slot" aria-label="Jawaban Anda">${st.ans.map((k, p) => `<button class="word" data-a="unpick" data-p="${p}">${esc(st.words[k])}</button>`).join("")}${st.ans.length ? "" : '<span class="hint">Ketuk kata-kata di bawah sesuai urutan</span>'}${st.ans.length === st.words.length ? `<span class="punct">${esc(st.punct)}</span>` : ""}</div>
      <div class="bank">${st.bank.map(k => `<button class="word${used.has(k) ? " used" : ""}" data-a="pickw" data-k="${k}"${used.has(k) ? " disabled" : ""}>${esc(st.words[k])}</button>`).join("")}</div>`;
    const c = $("#chk"); if (c) c.disabled = st.ans.length !== st.words.length;
  }

  function show() {
    if (i >= N) return finish();
    const c = items[i]; answered = false; st = {};
    let body = "";
    if (c.t === "m") {
      st.opts = shuffle(c.o);
      body = `<p class="qtext">${fmtQ(c.q)}</p><div class="opts">${st.opts.map((t, k) => `<button class="opt" data-a="pick" data-k="${k}"><kbd>${k + 1}</kbd><span>${esc(t)}</span></button>`).join("")}</div>`;
    } else if (c.t === "f") {
      const lx = c.key ? LESSONS.find(x => x.id === c.key.split(":")[0]) : null;
      body = `<div class="tstack"><div class="tcard" id="tcard">${lx ? `<span class="tag">${LEVELS[lx.li].cefr} · ${esc(lx.title)}</span>` : ""}<p class="qtext tq">${esc(c.q)}</p><span class="muted" style="font-weight:600">Kalimat atau pernyataan ini benar?</span></div></div><div class="tf"><button class="opt pop" data-a="tf" data-v="0">${I("x")} Salah</button><button class="opt pop" data-a="tf" data-v="1">${I("check")} Benar</button></div>`;
    } else if (c.t === "t") {
      body = `<p class="qtext">${fmtQ(c.q)}</p><form class="typer" novalidate><label class="sr" for="ans">Jawaban Anda</label><input id="ans" name="ans" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" placeholder="Ketik di sini"><button class="btn lv" type="submit">Periksa</button></form>`;
    } else {
      const m = c.s.match(/^(.*?)([.?!]*)$/); st.words = m[1].split(" "); st.punct = m[2]; st.ans = [];
      const idx = st.words.map((_, k) => k); let b = shuffle(idx), tries = 0;
      while (idx.length > 1 && b.every((v, k) => st.words[v] === st.words[k]) && tries++ < 20) b = shuffle(idx);
      st.bank = b;
      body = (c.t === "l"
        ? `<div class="listen"><button class="btn lv" data-a="play">${I("speaker")} Putar</button><button class="btn ghost" data-a="slow">Lambat</button></div><p class="muted" id="lhint"><button class="back" data-a="hint" style="padding:0">Tidak ada suara? Tampilkan artinya</button></p>`
        : `<p class="qtext">${esc(c.tr)}</p>`) + `<div id="ord"></div><button class="btn lv" data-a="check" id="chk" disabled>Periksa</button>`;
    }
    app.innerHTML = `<div class="quiz"${lv}>
      <div class="qbar"><button class="iconbtn" data-a="quit" aria-label="Keluar dari sesi">${I("x")}</button>${N <= 12 ? `<div class="blocks" style="--n:${N}" role="progressbar" aria-valuemin="0" aria-valuemax="${N}" aria-valuenow="${i}">${items.map((_, k) => `<span class="${k < i ? (o.silent ? "cur" : res[k] ? "ok" : "no") : k === i ? "cur" : ""}"></span>`).join("")}</div>` : `<div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="${N}" aria-valuenow="${i}"><i style="width:${i / N * 100}%"></i></div>`}<span class="qcount">${i + 1}/${N}</span><span id="combo">${comboHTML()}</span></div>
      <div id="confirm"></div>${o.ctx || ""}
      <p class="eyebrow">${QLABEL[c.t]}</p>${body}
      <div id="fb" aria-live="polite"></div>
      ${o.silent ? `<button class="btn ghost skip" data-a="skip">Saya tidak tahu</button>` : ""}</div>`;
    if (c.t === "o" || c.t === "l") drawOrd();
    if (c.t === "t") { try { $("#ans").focus({ preventScroll: true }); } catch (e) {} }
    if (c.t === "l") speak(c.s);
    toTop();
  }

  function grade(ok) {
    if (answered) return; answered = true;
    const c = items[i]; res.push(ok);
    if (o.silent) { i++; return show(); }
    S.ans++;
    if (ok) { right++; combo++; maxCombo = Math.max(maxCombo, combo); S.cor++; { const td = dkey(); S.dc[td] = (S.dc[td] || 0) + 1; S.dcombo[td] = Math.max(S.dcombo[td] || 0, combo); } if (combo > S.combo) S.combo = combo; if (c.key) srsHit(S.wrong, c.key, true); addXp(10); gained += 10; sfx.ok(); }
    else { combo = 0; if (c.key) srsHit(S.wrong, c.key, false); missed.push(c); sfx.no(); }
    save();
    const blk = $$(".blocks span")[i]; if (blk) blk.className = ok ? "ok" : "no";
    const pg = $(".prog i"); if (pg) pg.style.width = (i + 1) / N * 100 + "%";
    $("#combo").innerHTML = comboHTML();
    $("#fb").innerHTML = `<div class="fb ${ok ? "ok" : "no"}"><p class="fb-h"><span>${ok ? pick(PRAISE) : "Belum tepat"}</span>${ok ? '<span class="plus">+10 XP</span>' : ""}</p>
      ${!ok || c.t === "l" ? `<p>Jawaban: <b>${esc(answerOf(c))}</b></p>` : ""}${c.t === "l" ? `<p>${esc(c.tr)}</p>` : ""}${c.e ? `<p>${esc(c.e)}</p>` : ""}${c.key ? `<a class="report" href="${reportUrl(c)}" target="_blank" rel="noopener">Ada yang salah dengan soal ini? Laporkan</a>` : ""}
      <button class="btn ${ok ? "good" : "bad"}" data-a="next" id="nx">${i + 1 < N ? "Lanjut" : "Lihat hasil"}</button></div>`;
    try { $("#nx").focus({ preventScroll: true }); } catch (e) {}
    try { $("#fb").scrollIntoView({ block: "nearest", behavior: "smooth" }); } catch (e) {}
  }

  function finish() {
    QUIZ = null; stopSpeak();
    if (o.silent) { document.body.classList.remove("focus"); return o.onEnd(res); }
    const pct = Math.round(right / N * 100);
    let bonus = 0;
    if (o.bonus && pct >= 75) bonus += 20;
    if (o.bonus && pct === 100) bonus += 30;
    if (o.extra) bonus += o.extra(pct) || 0;
    if (bonus) addXp(bonus);
    if (o.onEnd) o.onEnd(pct);
    const nb = newBadges(); save();
    const passed = o.pass ? pct >= o.pass : pct >= 60;
    const head = pct === 100 ? "Sempurna!" : passed ? (o.pass ? "Lulus!" : "Kerja bagus!") : pct >= 50 ? "Hampir sampai" : "Belum sampai";
    const sub = o.pass ? (passed ? (o.passMsg || "Pelajaran ini ditandai selesai.") : "Butuh " + o.pass + "% untuk lulus. Ulangi soal yang salah, lalu coba lagi.") : (o.msg || "Sesi selesai.");
    const goNext = o.next && passed;
    app.innerHTML = `<div class="quiz stack"${lv}>
      <p class="eyebrow">${esc(o.title)}</p>
      <div class="res-top">${ring(pct / 100, pct + "%", right + " dari " + N + " benar", "big")}<div><h1>${head}</h1><p class="muted">${sub}</p></div></div>
      <dl class="stats3"><div><dt>XP didapat</dt><dd>+${gained + bonus}</dd></div><div><dt>Combo terbaik</dt><dd>${maxCombo}×</dd></div><div><dt>Perlu diulang</dt><dd>${missed.length}</dd></div></dl>
      ${nb.map(b => `<div class="newbadge">${I(b.ic)}<div><b>Lencana baru: ${b.n}</b><span>${b.d}</span></div></div>`).join("")}
      ${goNext ? `<button class="btn lv" data-a="next">Pelajaran berikutnya ${I("right")}</button>` : ""}

      ${missed.length ? `<h2 style="margin-top:12px">Yang perlu diulang</h2><ul class="missed">${missed.map(m => `<li>${esc(m.t === "o" || m.t === "l" ? m.tr : m.q)}<br><b>${esc(answerOf(m))}</b>${m.e ? `<small>${esc(m.e)}</small>` : ""}</li>`).join("")}</ul>` : ""}</div>`;
    H = {
      next() { o.next(); }, again() { o.again(); }, back() { o.back(); },
      redo() { runQuiz(shuffle(missed), { title: o.title + " · ulangan", li: o.li, back: o.back, again: o.again, msg: "Ulangan soal yang tadi salah." }); }
    };
    if (passed) { sfx.win(); confetti(); }
    toTop();
  }

  H = {
    quit() { $("#confirm").innerHTML = `<div class="confirm"><span>Keluar dari sesi ini? XP yang sudah didapat tetap tersimpan.</span><span class="row"><button class="btn ghost auto" data-a="stay">Lanjutkan</button><button class="btn bad auto" data-a="leave">Keluar</button></span></div>`; },
    stay() { $("#confirm").innerHTML = ""; },
    leave() { o.back(); },
    pick(el) {
      if (answered) return;
      const c = items[i], ok = st.opts[+el.dataset.k] === c.o[0];
      if (!o.silent) { $$(".opt").forEach((b, k) => { b.disabled = true; if (st.opts[k] === c.o[0]) b.classList.add("right"); }); if (!ok) el.classList.add("wrong"); }
      grade(ok);
    },
    tf(el) {
      if (answered) return;
      const c = items[i], v = el.dataset.v === "1", ok = v === c.a;
      $$(".opt").forEach(b => { b.disabled = true; if ((b.dataset.v === "1") === c.a) b.classList.add("right"); });
      if (!ok) el.classList.add("wrong");
      const tc = $("#tcard"); if (tc) tc.classList.add(v ? "r" : "l", ok ? "ok" : "no");
      grade(ok);
    },
    submit(form) {
      if (answered) return;
      const inp = $("#ans"), v = norm(inp.value); if (!v) { inp.focus(); return; }
      const ok = accepts(items[i].a, inp.value);
      inp.disabled = true; inp.classList.add(ok ? "right" : "wrong");
      const b = form.querySelector("button"); if (b) b.remove();
      grade(ok);
    },
    pickw(el) { if (answered) return; st.ans.push(+el.dataset.k); drawOrd(); },
    unpick(el) { if (answered) return; st.ans.splice(+el.dataset.p, 1); drawOrd(); },
    check() {
      if (answered || st.ans.length !== st.words.length) return;
      const ok = st.ans.map(k => st.words[k]).join(" ") === st.words.join(" ");
      $("#ord").classList.add("locked", ok ? "right" : "wrong");
      const b = $("#chk"); if (b) b.remove();
      grade(ok);
    },
    play() { speak(items[i].s); },
    slow() { speak(items[i].s, true); },
    hint() { const h = $("#lhint"); if (h) h.textContent = "Artinya: " + items[i].tr; },
    next() { i++; show(); },
    skip() { if (answered) return; res.push(false); i++; show(); }
  };
  QUIZ = {
    enter() {
      if (i >= N) return false;
      if (answered) { H.next(); return true; }
      const c = items[i];
      if ((c.t === "o" || c.t === "l") && st.ans.length === st.words.length) { H.check(); return true; }
      return false;
    },
    digit(k) { if (i < N && items[i].t === "m" && !answered) { const b = $$(".opt")[k]; if (b) H.pick(b); } }
  };
  show();
}

/* ================= match game ================= */
function matchGame(pool, o) {
  clearInterval(TICK); stopSpeak();
  document.body.classList.add("focus");
  const lv = o.li != null ? ` style="--lv:var(--l${o.li + 1})"` : "";
  const en = new Set(), id = new Set(), pairs = [];
  for (const p of shuffle(pool)) { if (pairs.length >= 6) break; if (en.has(p[0]) || id.has(p[1])) continue; en.add(p[0]); id.add(p[1]); pairs.push(p); }
  const A = shuffle(pairs.map((_, k) => k)), B = shuffle(pairs.map((_, k) => k));
  let sa = null, sb = null, done = 0, miss = 0, lock = false;
  const t0 = Date.now();
  app.innerHTML = `<div class="quiz"${lv}>
    <div class="qbar"><button class="iconbtn" data-a="leave" aria-label="Keluar">${I("x")}</button><div class="prog"><i id="mp" style="width:0%"></i></div><span class="qcount" id="mt">0 dtk</span></div>
    <p class="eyebrow">Cocokkan kata dengan artinya</p>
    <div class="match" style="margin-top:18px">${pairs.map((_, r) => `<button class="opt" data-a="ma" data-k="${A[r]}">${esc(pairs[A[r]][0])}</button><button class="opt" data-a="mb" data-k="${B[r]}">${esc(pairs[B[r]][1])}</button>`).join("")}</div></div>`;
  TICK = setInterval(() => { const e = $("#mt"); if (e) e.textContent = Math.round((Date.now() - t0) / 1000) + " dtk"; }, 500);
  function test() {
    if (!sa || !sb) return;
    const a = sa, b = sb; sa = sb = null;
    if (a.dataset.k === b.dataset.k) {
      [a, b].forEach(x => { x.classList.remove("sel"); x.classList.add("gone"); x.disabled = true; });
      done++; sfx.ok(); $("#mp").style.width = done / pairs.length * 100 + "%";
      if (done === pairs.length) end();
    } else {
      miss++; sfx.no(); lock = true;
      [a, b].forEach(x => { x.classList.remove("sel"); x.classList.add("wrong"); });
      setTimeout(() => { [a, b].forEach(x => x.classList.remove("wrong")); lock = false; }, 420);
    }
  }
  function end() {
    clearInterval(TICK); TICK = null;
    const secs = Math.max(1, Math.round((Date.now() - t0) / 1000)), xp = 15 + (miss ? 0 : 5);
    const rec = !!o.record && (!S.matchBest || secs < S.matchBest);
    addXp(xp); if (rec) S.matchBest = secs;
    const nb = newBadges(); save(); sfx.win(); if (rec || !miss) confetti();
    app.innerHTML = `<div class="quiz stack"${lv}>
      <p class="eyebrow">Cocokkan kata</p>
      <h1>${rec ? "Rekor baru!" : miss ? "Semua pasangan ketemu" : "Tanpa salah!"}</h1>
      <dl class="stats3"><div><dt>Waktu</dt><dd>${secs} dtk</dd></div><div><dt>Salah pasang</dt><dd>${miss}</dd></div><div><dt>XP didapat</dt><dd>+${xp}</dd></div></dl>
      ${nb.map(b => `<div class="newbadge">${I(b.ic)}<div><b>Lencana baru: ${b.n}</b><span>${b.d}</span></div></div>`).join("")}
      <button class="btn lv" data-a="again">Main lagi</button><button class="btn ghost" data-a="back">Kembali</button></div>`;
    H = { again() { o.again(); }, back() { o.back(); } };
    toTop();
  }
  const sel = side => el => {
    if (lock) return;
    $$('.match [data-a="' + side + '"]').forEach(b => b.classList.remove("sel"));
    el.classList.add("sel"); if (side === "ma") sa = el; else sb = el; test();
  };
  H = { leave() { o.back(); }, ma: sel("ma"), mb: sel("mb") };
  toTop();
}

        ${canSpeak() ? `<button class="btn ghost" data-say="${esc(c.w)}">${I("speaker")} Dengarkan</button>` : ""}
        <div class="pair"><button class="btn bad" data-a="later">Belum hafal</button><button class="btn good" data-a="know">Sudah hafal</button></div>

        : `<div class="card stack"><h2>Kartu hari ini selesai</h2><p class="muted">Kata yang sudah hafal akan muncul lagi sesuai jadwal. Pilih level lain, atau ulangi semua dari awal.</p><button class="btn" data-a="resetk">Ulangi semua dari awal</button></div>`}</div>`;

  };
  draw();
};
